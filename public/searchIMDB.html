<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <title>Movie Search</title>

<body id="searchIMDB-body">
    <header>

        <section class="buttonANDlogo">
            <a href="homepage.html"
                style="width: 45px; height: 45px; font-size: 35px; background-color: transparent; border: none;">

            </a>
            <a href="homepage.html">
                <p id="israTubeText">Search🍿</p>

        <section class="searchSystem">
            <div class="controls">
                <input id="searchInput" placeholder="Type to search…" autocomplete="off">
                <button id="filterBtn">Filter</button>
                <div id="filterPanel" class="hidden">
                    <h3>Filter by Genre</h3>
                    <div id="genreCheckboxes"></div>
                </div>
            </div>
            <a id="search-goto-fav" href="favoriteIMDB.html">Favorites</a>

        </section>




        <section class="loginSystem">
            <input id="moonDark" type="image" src="images/moonWhiteIcon.png" alt="darkmode" width="45" height="45">

            <section id="profileArea">
                <input id="profileIcon" type="image" src="images/profileIcon.png" alt="profile">
                <a href="index.html" id="logoutLink">Logout</a>
            </section>
        </section>

        <!-- <button id="loginBtn" onclick='window.location.href="index.html"'>Login</button> -->
        </section>

    </header>
